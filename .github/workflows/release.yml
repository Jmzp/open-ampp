name: Release

# Builds the desktop installers when a `v*` tag is pushed and attaches them, together with the
# signed updater manifest (latest.json), to a draft GitHub release.
#
# Required secret: TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key
# has one) to sign updates. Optional secrets, used only when present:
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (Developer ID signing + notarization)
# Without the Apple secrets the app is ad-hoc signed, which runs after the usual
# right-click → Open on first launch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }
          # Ubuntu 22.04 keeps the glibc requirement of the Linux packages reasonably low.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # Tauri bundles `binaries/ampp-<target>` next to the app executable (see tauri.release.conf.json).
      - name: Build the ampp CLI sidecar
        shell: bash
        run: |
          cargo build --release -p ampp-cli
          ext=""; [ "$RUNNER_OS" = Windows ] && ext=".exe"
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/release/ampp$ext" "apps/desktop/src-tauri/binaries/ampp-${{ matrix.target }}$ext"

      # Tauri treats an empty variable as set, so signing variables are only exported when the
      # secret exists.
      - name: Apple signing (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Open AMPP ${{ github.ref_name }}
          releaseBody: |
            Installers for Open AMPP ${{ github.ref_name }}. / Instaladores de Open AMPP ${{ github.ref_name }}.

            - macOS: `.dmg` (Apple Silicon: `aarch64`, Intel: `x64`)
            - Windows: `.msi` or `-setup.exe`
            - Linux: `.AppImage`, `.deb` or `.rpm` (x64 and arm64)
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Uploads from parallel jobs occasionally collide ("already_exists"); retrying replaces the asset.
          retryAttempts: 2
