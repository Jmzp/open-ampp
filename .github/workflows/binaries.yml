name: Binaries

# Builds portable Apache, MariaDB and PHP (CLI + FPM) for macOS and Linux (x64 and arm64),
# publishes them as `bin-<tool>-<version>` releases and refreshes catalog/manifest.json on main.
# The daily run only looks for new PHP patch releases (security fixes) and builds what is missing;
# installed apps pick up the refreshed catalog and offer the update.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      what:
        description: "What to build"
        type: choice
        options: [all, apache, mariadb, php]
        default: all

permissions:
  contents: write

jobs:
  apache:
    if: inputs.what == 'all' || inputs.what == 'apache'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, container: "" }
          - { runner: macos-15-intel, container: "" }
          # AlmaLinux 8 (glibc 2.28) so the binaries also run on older distros.
          - { runner: ubuntu-24.04, container: "almalinux:8" }
          - { runner: ubuntu-24.04-arm, container: "almalinux:8" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: binaries/linux-deps.sh
      - name: Build
        run: WORK="$RUNNER_TEMP/work" binaries/build-apache.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: apache-${{ matrix.runner }}
          path: dist/*.tar.gz

  mariadb:
    if: inputs.what == 'all' || inputs.what == 'mariadb'
    strategy:
      fail-fast: false
      matrix:
        version: ["10.11.19", "11.4.13", "11.8.9", "12.3.3"]
        platform:
          - { runner: macos-15, container: "" }
          - { runner: macos-15-intel, container: "" }
          - { runner: ubuntu-24.04, container: "almalinux:8" }
          - { runner: ubuntu-24.04-arm, container: "almalinux:8" }
    runs-on: ${{ matrix.platform.runner }}
    container: ${{ matrix.platform.container }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: binaries/linux-deps.sh
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          # Only the versions not published yet are built.
          SKIP_EXISTING: "1"
        run: WORK="$RUNNER_TEMP/work" binaries/build-mariadb.sh "${{ matrix.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: mariadb-${{ matrix.version }}-${{ matrix.platform.runner }}
          path: dist/*.tar.gz

  php:
    if: github.event_name == 'schedule' || inputs.what == 'all' || inputs.what == 'php'
    strategy:
      fail-fast: false
      # Fewer simultaneous jobs keeps static-php-cli under GitHub's API burst limits.
      max-parallel: 6
      matrix:
        # Each minor resolves to its latest patch release at build time (see build-php.sh).
        version: ["8.2", "8.3", "8.4", "8.5"]
        # static-php-cli links Linux builds statically against musl, so no old-glibc container is needed.
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          # Avoids GitHub API rate limits while static-php-cli downloads sources.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          SKIP_EXISTING: "1"
        run: WORK="$RUNNER_TEMP/work" binaries/build-php.sh "${{ matrix.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: php-${{ matrix.version }}-${{ matrix.runner }}
          path: dist/*.tar.gz
          if-no-files-found: ignore

  publish:
    needs: [apache, mariadb, php]
    # Publish whatever was built, even if some job was skipped or failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: binaries/publish.sh dist
      - name: Refresh the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        # Built from the newest main (not the commit the run started on) and retried, since main
        # may move while the builds run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main
            git checkout -q -B main origin/main
            python3 catalog/generate.py
            if git diff --quiet catalog/manifest.json; then
              echo "catalog unchanged"
              exit 0
            fi
            git commit -qam "Catalog: refresh published binaries"
            git push -q origin main && exit 0
            echo "main moved; retrying"
            sleep 10
          done
          exit 1
