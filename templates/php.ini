; Generado por OPEN_AMPP: se sobrescribe en cada inicio.
[PHP]
engine = On
short_open_tag = Off
memory_limit = 256M
max_execution_time = 120
error_reporting = E_ALL
display_errors = On
display_startup_errors = On
log_errors = On
error_log = "{{error_log}}"
post_max_size = 64M
upload_max_filesize = 64M
file_uploads = On
{{extension_dir}}
{{extensions}}

[Date]
date.timezone = UTC
