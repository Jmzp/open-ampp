; Generated by Open AMPP: rewritten on every start.
[global]
pid = "{{pid_file}}"
error_log = "{{error_log}}"
daemonize = no

[www]
listen = 127.0.0.1:{{port}}
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
catch_workers_output = yes
clear_env = no
