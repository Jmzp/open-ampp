[workspace]
resolver = "2"
members = ["crates/ampp-core", "crates/ampp-cli", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ampp-core = { path = "crates/ampp-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
