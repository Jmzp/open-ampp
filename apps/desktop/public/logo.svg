<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
    <filter id="led" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Fondo tipo squircle con margen para el estilo de macOS -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="188.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- Tres capas: Apache, PHP, MariaDB -->
  <g filter="url(#shadow)">
    <rect x="242" y="282" width="540" height="128" rx="40" fill="url(#bar)"/>
    <rect x="242" y="448" width="540" height="128" rx="40" fill="url(#bar)" opacity="0.94"/>
    <rect x="242" y="614" width="540" height="128" rx="40" fill="url(#bar)" opacity="0.88"/>
  </g>

  <!-- Luces de estado -->
  <g filter="url(#led)">
    <circle cx="318" cy="346" r="24" fill="#F97316"/>
    <circle cx="318" cy="512" r="24" fill="#6366F1"/>
    <circle cx="318" cy="678" r="24" fill="#14B8A6"/>
  </g>

  <!-- Ranuras -->
  <g fill="#C7CBF5">
    <rect x="378" y="336" width="150" height="20" rx="10"/>
    <rect x="378" y="502" width="110" height="20" rx="10"/>
    <rect x="378" y="668" width="180" height="20" rx="10"/>
  </g>
  <g fill="#DADCF8">
    <rect x="634" y="336" width="20" height="20" rx="10"/>
    <rect x="674" y="336" width="20" height="20" rx="10"/>
    <rect x="714" y="336" width="20" height="20" rx="10"/>
    <rect x="634" y="502" width="20" height="20" rx="10"/>
    <rect x="674" y="502" width="20" height="20" rx="10"/>
    <rect x="714" y="502" width="20" height="20" rx="10"/>
    <rect x="634" y="668" width="20" height="20" rx="10"/>
    <rect x="674" y="668" width="20" height="20" rx="10"/>
    <rect x="714" y="668" width="20" height="20" rx="10"/>
  </g>
</svg>
