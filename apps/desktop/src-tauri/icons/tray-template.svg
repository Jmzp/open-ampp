      <circle cx="11.5" cy="9.5" r="2.4" fill="#000"/>
      <circle cx="11.5" cy="22" r="2.4" fill="#000"/>
      <circle cx="11.5" cy="34.5" r="2.4" fill="#000"/>
      <rect x="18" y="8.4" width="16" height="2.2" rx="1.1" fill="#000"/>
      <rect x="18" y="20.9" width="16" height="2.2" rx="1.1" fill="#000"/>
      <rect x="18" y="33.4" width="16" height="2.2" rx="1.1" fill="#000"/>
